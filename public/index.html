<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007aff">
<title>Studay - AI Study Companion</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Frontend - Member B : Studay Liquid Glass UI -->
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="app">
  <aside class="sidebar">
    <div class="logo">Studay<small>AI Study Companion</small></div>
    <nav>
      <button class="nav-btn active" data-view="dashboard"><span class="dot"></span>Dashboard</button>
      <button class="nav-btn" data-view="subjects"><span class="dot"></span>Subjects</button>
      <button class="nav-btn" data-view="notes"><span class="dot"></span>Notes</button>
      <button class="nav-btn" data-view="flashcards"><span class="dot"></span>Flashcards</button>
      <button class="nav-btn" data-view="quiz"><span class="dot"></span>Quiz</button>
      <button class="nav-btn" data-view="ai"><span class="dot"></span>AI Studio</button>
      <button class="nav-btn" data-view="timer"><span class="dot"></span>Focus Timer</button>
    </nav>
    <div class="sidebar-foot">
      <button id="theme-toggle" title="Toggle dark mode">Dark mode</button>
      <div class="xp-wrap">
        <div class="xp-label"><span>Study XP</span><span id="xp-val">0</span></div>
        <div class="xp-bar"><div id="xp-fill"></div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <input id="global-search" placeholder="Search notes, flashcards..." aria-label="Search">
      <div class="streak">Streak <span id="streak-val">0</span> days</div>
    </header>

    <main id="views">
      <!-- DASHBOARD -->
      <section class="view active" id="view-dashboard">
        <h2>Good to see you.</h2>
        <div class="stats">
          <div class="stat"><span id="stat-subjects">0</span><label>Subjects</label></div>
          <div class="stat"><span id="stat-notes">0</span><label>Notes</label></div>
          <div class="stat"><span id="stat-cards">0</span><label>Flashcards</label></div>
          <div class="stat"><span id="stat-quiz">0</span><label>Quizzes taken</label></div>
        </div>
        <div class="grid2">
          <div class="panel">
            <h3>Quick add note</h3>
            <form id="quick-note-form">
              <select id="quick-note-subject" aria-label="Subject"></select>
              <input id="quick-note-title" placeholder="Note title" required>
              <textarea id="quick-note-content" placeholder="Jot it down fast..." required></textarea>
              <button type="submit">Save + AI summarise</button>
            </form>
          </div>
          <div class="panel">
            <h3>Continue studying</h3>
            <div id="recent-list"></div>
            <h3 style="margin-top:1rem">Deadlines</h3>
            <form id="deadline-form">
              <input id="deadline-title" placeholder="e.g. Midterm - Databases" required>
              <input id="deadline-date" type="date" required>
              <button type="submit">Add</button>
            </form>
            <div id="deadline-list"></div>
          </div>
        </div>
      </section>

      <!-- SUBJECTS -->
      <section class="view" id="view-subjects">
        <h2>Subjects</h2>
        <form id="subject-form" class="inline-form">
          <input id="subject-name" placeholder="New subject name" required>
          <input id="subject-color" type="color" value="#007aff" aria-label="Subject color">
          <button type="submit">Add Subject</button>
        </form>
        <div id="subject-list" class="card-grid"></div>
      </section>

      <!-- NOTES -->
      <section class="view" id="view-notes">
        <h2>Notes</h2>
        <div class="toolbar">
          <select id="notes-filter-subject" aria-label="Filter by subject"><option value="">All subjects</option></select>
          <select id="notes-sort" aria-label="Sort notes">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Title A-Z</option>
          </select>
          <button id="export-notes" class="ghost">Export JSON</button>
        </div>
        <form id="note-form">
          <select id="note-subject" required aria-label="Subject"></select>
          <input id="note-title" placeholder="Note title" required>
          <textarea id="note-content" placeholder="Write your study notes here..." required></textarea>
          <button type="submit">Save Note</button>
        </form>
        <div id="note-list"></div>
      </section>

      <!-- FLASHCARDS -->
      <section class="view" id="view-flashcards">
        <h2>Flashcards</h2>
        <div class="toolbar">
          <select id="cards-filter-note" aria-label="Filter by deck"><option value="">All decks</option></select>
          <button id="study-mode-btn">Study mode</button>
          <button id="shuffle-cards" class="ghost">Shuffle</button>
        </div>
        <div id="card-list" class="card-grid"></div>
        <div id="study-mode" class="hidden panel">
          <div id="study-card" class="flip-card"><div id="study-text">Press Next</div></div>
          <div class="toolbar">
            <button id="study-flip" class="ghost">Flip</button>
            <button id="study-next" class="ghost">Next</button>
            <button id="study-knew" class="ok">I knew it</button>
            <button id="study-review" class="ghost">Review later</button>
            <button id="study-exit" class="danger">Exit</button>
          </div>
          <div id="study-progress"></div>
        </div>
      </section>

      <!-- QUIZ -->
      <section class="view" id="view-quiz">
        <h2>Quiz</h2>
        <div class="toolbar">
          <select id="quiz-note" aria-label="Quiz source note"></select>
          <button id="quiz-start">Start quiz</button>
        </div>
        <div id="quiz-box"></div>
        <div id="quiz-history"></div>
      </section>

      <!-- AI STUDIO -->
      <section class="view" id="view-ai">
        <h2>AI Studio</h2>
        <div class="toolbar">
          <select id="ai-note" aria-label="AI source note"></select>
          <select id="ai-mode" aria-label="AI mode">
            <option value="all">Summary + Flashcards + Quiz</option>
            <option value="summary">Summary only</option>
            <option value="flashcards">Flashcards only</option>
            <option value="quiz">Quiz only</option>
          </select>
          <button id="ai-run">Generate</button>
        </div>
        <div class="panel">
          <h3>Or paste any text</h3>
          <textarea id="ai-paste" placeholder="Paste lecture text, article, anything..."></textarea>
          <button id="ai-run-paste">Generate from pasted text</button>
        </div>
        <div id="ai-output"></div>
      </section>

      <!-- TIMER -->
      <section class="view" id="view-timer">
        <h2>Focus Timer</h2>
        <div class="panel timer-panel">
          <div id="timer-display">25:00</div>
          <div class="toolbar" style="justify-content:center">
            <button data-mins="15" class="ghost">15m</button>
            <button data-mins="25" class="ghost">25m</button>
            <button data-mins="50" class="ghost">50m</button>
          </div>
          <div class="toolbar" style="justify-content:center">
            <button id="timer-start">Start</button>
            <button id="timer-pause" class="ghost">Pause</button>
            <button id="timer-reset" class="ghost">Reset</button>
          </div>
          <div id="timer-log"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="toast" role="status"></div>

<!-- Edit modal -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <h3 id="modal-title">Edit</h3>
    <input id="modal-field1" placeholder="Title / name">
    <textarea id="modal-field2" placeholder="Content"></textarea>
    <div class="toolbar">
      <button id="modal-save">Save</button>
      <button id="modal-cancel" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
